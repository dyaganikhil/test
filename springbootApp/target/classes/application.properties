server.servlet.context-path=/api
spring.servlet.multipart.max-request-size=3000MB
spring.servlet.multipart.max-file-size=3000MB
cors.allowed.origins=https://apaims2.0.vassarlabs.com,http://apaims2.0.vassarlabs.com,https://fieldrishi.vassarlabs.com,https://apagriculture.vassarlabs.com,http://apagriculture.vassarlabs.com, http://localhost:8092, https://agriculture.ap.gov.in, https://aspire.ap.gov.in, https://apaims.ap.gov.in,http://apaims-staging.ap.gov.in,http://localhost:8093
application.prod.activate=${PROD_ACTIVATE:false}
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator
server.tomcat.threads.max=500
server.tomcat.threads.min-spare=50

logging.level.root=INFO
logging.config=classpath:logback-spring.xml

# Needed for wrims-core-forecast's WeatherForecastService_v2 <-> WeatherForecastFileParserServiceImpl_v2
# bean cycle (unmigrated, still Boot 2.2.6 - tolerated a circular reference Boot 2.6+ rejects by
# default). Real fix is migrating that repo; this just restores the old, tolerant behavior.
spring.main.allow-circular-references=true
# TODO remove once confirmed: Boot 2.6 switched MVC request matching to PathPatternParser
#spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Boot 3: the Cassandra 4.x driver is on the classpath, but the app does not use a Boot-managed CqlSession
# (wrims-core-platform manages its own connections). Without this, Boot creates one for localhost:9042.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.cassandra.CassandraAutoConfiguration

# SwaggerSecurityConfig requires this (no default) - was never set anywhere, so the app failed to
# start on first run. Matches swagger.auth.username's own weak "swagger" fallback - this only
# gates the swagger-ui/api-docs endpoints, not application data. Override via env var per
# environment rather than relying on this default.
swagger.auth.password=${SWAGGER_AUTH_PASSWORD:swagger}
